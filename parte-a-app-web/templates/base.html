<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{% block title %}Stark Manufactura · Portal interno{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
<header>
  <strong>Stark Manufactura · Portal interno</strong>
  {% if session.user_id %}
    <a href="{{ url_for('dashboard') }}">Inicio</a>
    <a href="{{ url_for('buscar') }}">Catálogo</a>
    <a href="{{ url_for('comentarios') }}">Avisos</a>
    <a href="{{ url_for('perfil', user_id=session.user_id) }}">Mi perfil</a>
    <a href="{{ url_for('logout') }}">Salir ({{ session.username }})</a>
  {% endif %}
</header>
<main>
  <p class="aviso">Aplicación de laboratorio (versión corregida). Datos ficticios. Uso académico.</p>
  {% block content %}{% endblock %}
</main>
</body>
</html>
